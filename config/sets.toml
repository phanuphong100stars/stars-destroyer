# ชุดสำเร็จรูป (ค่าเริ่มต้นของโปรเจกต์ — เพิ่ม/ทับได้ที่ ~/.config/destroyer/sets.toml)
# tier = "A"  → ทุกอย่างที่เป็น tier A (tier C ใส่ผ่าน tier ไม่ได้ ต้องเขียนใน only เอง)
# only = [..] → ระบุ id (ใช้ * ได้) · include = [..] → รวมชุดอื่น
default = "sweep"

[sets.safe]
tier = "A"

[sets.android-stale]   # emulator ไม่ได้ใช้ (รันบนเครื่องจริง)
only = ["android:avd-snapshots:*", "android:avd-userdata:*", "android:avd:*", "android:image:android-34:*", "android:ndk:28.*"]

[sets.leftovers]       # ของค้างที่บอกว่าไม่เอา
only = ["xcode:sim:iphone-18-pro-max-*", "ai:hf:*", "flutter:sdk:flutter-3.35.0"]

[sets.sweep]           # ชุดของคุณ
include = ["safe", "android-stale", "leftovers"]
